<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071418">
<title>山海乱斗 · 无生物完整背景 + 透明兽魂序列帧</title>
<style>
:root{font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:#eef5e9;color-scheme:dark;background:#071315}
*{box-sizing:border-box}
body{margin:0;display:flex;justify-content:center;min-height:100svh;background:radial-gradient(ellipse at 50% 30%,#213531,#071315 70%)}
main{display:flex;flex-direction:column;align-items:center;padding:10px;gap:8px}
.stage{width:min(432px,calc(100vw - 20px),calc((100svh - 75px)*.5625));aspect-ratio:9/16;position:relative;overflow:hidden;border:1px solid #817b6459}
.background{display:block;position:absolute;inset:0;width:100%;height:100%;object-fit:fill}
#common-video{z-index:0}
#idle-poster{z-index:1}
#animal-layer{position:absolute;z-index:2;inset:0;width:100%;height:100%;pointer-events:none}
#result-picture{z-index:3}
header,.heading,.skip,.result,.bottom{z-index:4}
[hidden]{display:none!important}
button,select{font:inherit;color:#f6ebce;cursor:pointer;touch-action:manipulation}
header{position:absolute;top:6%;left:8%;right:8%;display:flex;justify-content:space-between;align-items:start}
.brand{letter-spacing:.22em;color:#d5d5be;font-size:17px}
.brand small{display:block;letter-spacing:.24em;font-size:9px;margin-top:6px;color:#a4bab0}
.quiet,.skip{background:#08191ddd;border:1px solid #7f998e7d;border-radius:4px}
.quiet{width:45px;height:45px;font-size:22px}
.heading{position:absolute;top:22%;left:6%;right:6%;text-align:center;font:normal 29px/1.5 "SimSun",serif;letter-spacing:.12em;text-shadow:0 2px 14px #1d6d69}
.bottom{position:absolute;left:8%;right:8%;bottom:7%;display:flex;flex-direction:column;gap:10px}
button.primary{min-height:54px;border:1px solid #b9a777a8;background:linear-gradient(105deg,#34483e,#566850,#31463a);letter-spacing:.12em;font-size:18px}
button:disabled{opacity:.5;cursor:wait}
select{background:#102a29;width:100%;padding:9px;border:1px solid #778a7e;font-size:14px}
.skip{position:absolute;top:15%;right:8%;min-height:46px;padding:8px 15px}
.result{position:absolute;top:63%;left:8%;right:8%;text-align:center}
.result p{color:#d2c698;font-size:14px;margin:0}
.result h2{font-family:"SimSun",serif;font-size:38px;margin:11px 0 0;font-weight:400}
.preparing{position:absolute;z-index:5;left:12%;right:12%;top:57%;text-align:center;padding:17px;background:#051719dc;border:1px solid #678e82;color:#d7efe2;font-size:16px;display:flex;flex-direction:column;gap:10px}
.preparing small{font-size:12px;color:#a6bfb5}
.status{font-size:12px;color:#b0c7be;min-height:26px;text-align:center;margin:4px 0 0}
.note{max-width:440px;font-size:12px;line-height:1.6;color:#b0b9ae;text-align:center}
.stage[data-phase="result"] .result p{color:#efdc9a}
@media(max-width:480px){
  main{padding:0}.stage{width:min(100vw,calc(100svh*.5625));border:0}
  .note{padding:0 10px}
}
</style>
</head>
<body>
<main>
<section class="stage" id="stage" data-phase="loading">
<video id="common-video" class="background" muted playsinline preload="metadata" hidden></video>
<img id="idle-poster" class="background" alt="" />
<canvas id="animal-layer" width="432" height="768" aria-label="透明兽魂逐帧动画"></canvas>
<img id="result-picture" class="background" alt="" hidden />
<audio id="selected-audio" preload="none" hidden></audio>
<header>
  <div class="brand">山海乱斗<small>SHANHAI ARENA</small></div>
  <button class="quiet" id="sound" title="静音">♪</button>
</header>
<div class="heading" id="heading">魂起，山海生</div>
<div id="preparing" class="preparing" hidden><div>兽魂正在准备…</div><small id="prepare-progress">0 / 0 组</small><small>准备完成后连续播放，不在演出中下载图片</small></div>
<button class="skip" id="skip" hidden>跳过演出</button>
<div class="result" id="result" hidden><p id="tier"></p><h2 id="beast-name"></h2></div>
<div class="bottom">
  <label id="sample-holder" for="sample"><select id="sample" aria-label="固定测试物种"></select></label>
  <button class="primary" id="wake" disabled>兽魂准备中…</button>
  <button class="primary" id="enter" hidden>踏入山海</button>
  <button class="primary" id="again" hidden>再体验一次</button>
</div>
</section>
<p class="status" id="status">正在读取实验资源…</p>
<p class="note">V4：进入开局页面即在后台准备所选动物。唤醒按钮只有资源准备完成才可点击，点击即播放，不会在点击后开始下载。测试版下拉框用于选择固定兽魂，正式游戏应在进入开局页时锁定本局抽取结果。</p>
</main>
<script src="player.js?v=4"></script>
</body>
</html>
