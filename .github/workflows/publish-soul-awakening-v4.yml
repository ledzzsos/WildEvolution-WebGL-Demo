name: Publish soul awakening V4 preload-on-menu demo
on:
  push:
    paths: ['.github/workflows/publish-soul-awakening-v4.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch CI-tested browser files
        env:
          SAMPLE_ZIP_URL: "https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-9c70-8206-ae46-677a8a2758af/raw?se=2026-10-10T16%3A46%3A40Z&sp=r&sv=2026-02-06&sr=b&scid=447b30a1-4552-504d-9a9f-f6bb7d3c594c&skoid=1e4bb9ed-6bb5-424a-a3aa-79f21566e722&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-10T00%3A53%3A00Z&ske=2026-10-11T00%3A53%3A00Z&sks=b&skv=2026-02-06&sig=mdPUJ3ZoWoNnNhbLES1u1plhLggILOLbmU0zrQy9%2BBs%3D"
        run: |
          curl --fail --silent --show-error --location --retry 3 "$SAMPLE_ZIP_URL" -o /tmp/awakening-v4.zip
          unzip -t /tmp/awakening-v4.zip
          mkdir -p soul-awakening-v4
          unzip -oq /tmp/awakening-v4.zip -d soul-awakening-v4
          test -s soul-awakening-v4/index.html
          test -s soul-awakening-v4/output/manifest.json
          grep -q '"version": 3' soul-awakening-v4/output/manifest.json
          grep -q 'prepareSelection(selector.value)' soul-awakening-v4/player.js
          grep -q 'function start()' soul-awakening-v4/player.js
      - name: Publish isolated sample, leave existing game and samples alone
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add soul-awakening-v4
          git commit -m "Publish selected-only menu-preloaded V4 awakening demo" || exit 0
          git push origin HEAD:main
