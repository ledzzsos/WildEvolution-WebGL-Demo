name: Publish transparent awakening V3 smooth playback proof
on:
  push:
    paths: ['.github/workflows/publish-soul-awakening-layered-v3.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download verified sample and validate
        env:
          SAMPLE_ZIP_URL: "https://sdmntprjapaneast.oaiusercontent.com/files/00000000-1ccc-8209-8549-91edb6f312b9/raw?se=2026-10-10T16%3A29%3A12Z&sp=r&sv=2026-02-06&sr=b&scid=d5d59753-46bf-5490-9931-f1029e66884f&skoid=1e4bb9ed-6bb5-424a-a3aa-79f21566e722&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-09T22%3A10%3A03Z&ske=2026-10-10T22%3A10%3A03Z&sks=b&skv=2026-02-06&sig=P0RjXHYy9cuvW6OmuIK8T%2BisO5Q8t2uN/hUcEnyiXFg%3D"
        run: |
          curl --fail --silent --show-error --location --retry 3 "$SAMPLE_ZIP_URL" -o /tmp/soul-layered-v3.zip
          unzip -t /tmp/soul-layered-v3.zip
          mkdir -p soul-awakening-layered-v3
          unzip -qo /tmp/soul-layered-v3.zip -d soul-awakening-layered-v3
          test -s soul-awakening-layered-v3/index.html
          test -s soul-awakening-layered-v3/output/manifest.json
          grep -q '"version": 3' soul-awakening-layered-v3/output/manifest.json
          test -s soul-awakening-layered-v3/output/background.mp4
      - name: Publish standalone V3 without modifying game or previous demos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add soul-awakening-layered-v3
          git commit -m "Publish smooth predecoded trimmed animal overlay V3" || exit 0
          git push origin HEAD:main
